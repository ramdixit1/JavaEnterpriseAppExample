# Namespace groups all banking resources in one on-prem Kubernetes cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: banking-platform
---
# Account service deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: account-service
  namespace: banking-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: account-service
  template:
    metadata:
      labels:
        app: account-service
    spec:
      containers:
        - name: account-service
          image: your-artifactory.example.com/docker-local/account-service:1.0.0
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: account-service
  namespace: banking-platform
spec:
  selector:
    app: account-service
  ports:
    - port: 8081
      targetPort: 8081
---
# Transaction service deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-service
  namespace: banking-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction-service
  template:
    metadata:
      labels:
        app: transaction-service
    spec:
      containers:
        - name: transaction-service
          image: your-artifactory.example.com/docker-local/transaction-service:1.0.0
          ports:
            - containerPort: 8082
          env:
            - name: CLIENTS_ACCOUNT_SERVICE_URL
              value: http://account-service:8081
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-service
  namespace: banking-platform
spec:
  selector:
    app: transaction-service
  ports:
    - port: 8082
      targetPort: 8082
---
# Gateway service deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: banking-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: your-artifactory.example.com/docker-local/gateway-service:1.0.0
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: banking-platform
spec:
  type: NodePort
  selector:
    app: gateway-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
---
# Frontend deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-frontend
  namespace: banking-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: banking-frontend
  template:
    metadata:
      labels:
        app: banking-frontend
    spec:
      containers:
        - name: banking-frontend
          image: your-artifactory.example.com/docker-local/banking-frontend:1.0.0
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: banking-frontend
  namespace: banking-platform
spec:
  type: NodePort
  selector:
    app: banking-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081
