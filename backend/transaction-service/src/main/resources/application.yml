# Transaction service runtime configuration.
server:
  port: 8082

spring:
  application:
    name: transaction-service
  datasource:
    url: jdbc:h2:mem:transactiondb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

clients:
  account-service:
    url: http://localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health,info
