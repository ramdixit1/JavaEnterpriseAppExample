# Gateway configuration for routing frontend calls to microservices.
server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: account-service-route
          uri: http://localhost:8081
          predicates:
            - Path=/accounts,/accounts/**
          filters:
            - RewritePath=/accounts/?(?<segment>.*), /api/accounts/${segment}
        - id: transaction-service-route
          uri: http://localhost:8082
          predicates:
            - Path=/transactions,/transactions/**
          filters:
            - RewritePath=/transactions/?(?<segment>.*), /api/transactions/${segment}

management:
  endpoints:
    web:
      exposure:
        include: health,info
